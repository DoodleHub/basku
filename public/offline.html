<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>basku — offline</title>
    <style>
      :root {
        --canvas: #faf8f4;
        --ink: #0f1b2a;
        --ink-muted: #636a78;
        --brand: #2f653e;
        --on-brand: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #141513;
          --ink: #f3f1ec;
          --ink-muted: #9d9b94;
          --brand: #6bb27f;
          --on-brand: #0e1a12;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--canvas);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { margin: 20px 0 8px; font-size: 1.5rem; letter-spacing: -0.02em; }
      p { margin: 0 0 24px; color: var(--ink-muted); }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 20px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: var(--on-brand);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>basku needs a connection to load your lists. We'll pick up where you left off.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
